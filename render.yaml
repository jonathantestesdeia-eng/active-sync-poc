services:
  - type: web
    name: active-sync-api
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: "uvicorn active_sync.api.app:app --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ACTIVE_SYNC_ALLOWED_ORIGINS
        value: https://supertrack-logistics.netlify.app
      - key: ACTIVE_SYNC_DATABASE_PATH
        value: /tmp/active-sync/active_sync.sqlite3
      - key: ACTIVE_SYNC_WORK_DIR
        value: /tmp/active-sync/runtime
      - key: ACTIVE_SYNC_PROFILE
        value: supertrack
      - key: ACTIVE_SYNC_INCREMENTAL_LOOKBACK_DAYS
        value: "7"
      - key: ACTIVE_SYNC_RECOVERY_LOOKBACK_DAYS
        value: "14"
      - key: ACTIVE_SYNC_INITIAL_LOAD_MODE
        value: current_month
      - key: ACTIVE_SYNC_API_KEY
        sync: false
      - key: ACTIVE_SYNC_BUILD_DATE
        sync: false
      - key: ACTIVE_USER
        sync: false
      - key: ACTIVE_PASSWORD
        sync: false
      - key: ACTIVE_COMPANY_ID
        sync: false
      - key: ACTIVE_BRANCH_ID
        sync: false
      - key: ACTIVE_USER_CODE
        sync: false
      - key: ACTIVE_ACCESS_TYPE
        value: C
      - key: ACTIVE_IS_DESTINATARIO
        value: "false"
